<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Project Chat</title>

    <script type="importmap">
      {
        "imports": {
          "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
          "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
          "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
          "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
          "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
        }
      }
    </script>

    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="app">Loading...</div>

    <template id="template">
      <div class="app-shell">
        <header class="topbar">
          <button
            v-if="!$graffitiSession.value"
            class="auth-btn"
            @click="$graffiti.login()"
          >
            Log In
          </button>
          <button
            v-else
            class="auth-btn"
            @click="$graffiti.logout($graffitiSession.value)"
          >
            Log Out
          </button>

          <h1>CleanChat: A Simple Chat App</h1>

          <nav class="nav-links">
            <router-link to="/">My Chats</router-link>
            <router-link to="/discover">Discover</router-link>
            <router-link to="/profile">Profile</router-link>
          </nav>

          <div class="info-btn-wrapper">
            <button class="info-btn" aria-label="About this app">?</button>
            <div class="info-tooltip">
              A chat app for easy collaboration and organization. Create chatrooms, tag messages
              into categories, filter by topic, and
              broadcast important announcements.
            </div>
          </div>
        </header>

        <router-view></router-view>
      </div>
    </template>
  </body>
</html>
